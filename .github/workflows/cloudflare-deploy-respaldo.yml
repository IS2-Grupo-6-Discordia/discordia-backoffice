name: Cloudflare Pages deploy de respaldo

on:
  push:
    branches: [main]

permissions:
  checks: read
  contents: read

jobs:
  respaldo:
    runs-on: ubuntu-latest
    steps:
      - name: Esperar a que Cloudflare tome el push
        run: sleep 240

      - name: Disparar el deploy hook si Cloudflare no construyó el commit
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "Falta el secreto CLOUDFLARE_DEPLOY_HOOK: no hay respaldo configurado."
            exit 0
          fi
          checks=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" \
            -q '[.check_runs[] | select(.name == "Cloudflare Pages")] | length')
          if [ "$checks" -gt 0 ]; then
            echo "Cloudflare ya construyó este commit."
            exit 0
          fi
          echo "Cloudflare no tomó el push: disparo el deploy hook."
          curl -fsS -X POST "$DEPLOY_HOOK"
